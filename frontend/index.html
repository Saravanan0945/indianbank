<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Indian Bank Login Portal">
    <title>Indian Bank - Login</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h1>Indian Bank</h1>
                <p>Secure Login Portal</p>
            </div>

            <form id="loginForm" class="login-form" novalidate>
                <div class="form-group">
                    <label for="username" class="form-label">Username or Email</label>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        class="form-input"
                        placeholder="Enter your username or email"
                        aria-label="Username or Email"
                        aria-required="true"
                        required
                    >
                    <span class="error-message" id="usernameError" role="alert" aria-live="polite"></span>
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <div class="password-input-wrapper">
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            class="form-input"
                            placeholder="Enter your password"
                            aria-label="Password"
                            aria-required="true"
                            required
                        >
                        <button 
                            type="button" 
                            class="toggle-password" 
                            id="togglePassword"
                            aria-label="Toggle password visibility"
                        >
                            <span class="eye-icon">👁️</span>
                        </button>
                    </div>
                    <span class="error-message" id="passwordError" role="alert" aria-live="polite"></span>
                </div>

                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" id="rememberMe" name="rememberMe">
                        <span>Remember me</span>
                    </label>
                    <a href="#" class="forgot-password-link" id="forgotPasswordLink">Forgot Password?</a>
                </div>

                <div class="error-message-box" id="generalError" role="alert" aria-live="assertive"></div>

                <button type="submit" class="btn-login" id="loginButton">
                    <span class="button-text">Login</span>
                    <span class="button-loader" style="display: none;">Loading...</span>
                </button>
            </form>

            <div class="login-footer">
                <p>Don't have an account? <a href="#" class="signup-link" id="signupLink">Sign Up</a></p>
            </div>

            <div class="security-notice">
                <p>🔒 Your connection is secure and encrypted</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
