<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="description" content="Indian Bank Login - Secure access to your banking account">
    <title>Indian Bank - Login</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="login-container">
        <header role="banner">
            <h1>Indian Bank</h1>
            <p class="subtitle">Secure Login Portal</p>
        </header>

        <main role="main">
            <div class="login-box">
                <h2>Sign In</h2>
                
                <!-- Error Message Container -->
                <div id="errorMessage" class="message error-message" role="alert" aria-live="polite" style="display: none;">
                    <span class="message-icon">⚠</span>
                    <span class="message-text"></span>
                </div>

                <!-- Success Message Container -->
                <div id="successMessage" class="message success-message" role="status" aria-live="polite" style="display: none;">
                    <span class="message-icon">✓</span>
                    <span class="message-text"></span>
                </div>

                <!-- Login Form -->
                <form id="loginForm" novalidate>
                    <div class="form-group">
                        <label for="username">Username / Email</label>
                        <input 
                            type="text" 
                            id="username" 
                            name="username"
                            class="form-control"
                            placeholder="Enter your username or email"
                            aria-label="Username or email address"
                            aria-required="true"
                            required
                            autocomplete="username"
                            maxlength="100"
                        >
                        <span class="field-error" id="usernameError" role="alert"></span>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <div class="password-wrapper">
                            <input 
                                type="password" 
                                id="password" 
                                name="password"
                                class="form-control"
                                placeholder="Enter your password"
                                aria-label="Password"
                                aria-required="true"
                                required
                                autocomplete="current-password"
                                minlength="6"
                                maxlength="50"
                            >
                            <button 
                                type="button" 
                                class="toggle-password" 
                                id="togglePassword"
                                aria-label="Toggle password visibility"
                                tabindex="-1"
                            >
                                <span class="eye-icon">👁</span>
                            </button>
                        </div>
                        <span class="field-error" id="passwordError" role="alert"></span>
                    </div>

                    <div class="form-options">
                        <label class="checkbox-label">
                            <input type="checkbox" id="rememberMe" name="rememberMe">
                            <span>Remember me</span>
                        </label>
                        <a href="#" class="forgot-password">Forgot Password?</a>
                    </div>

                    <button 
                        type="submit" 
                        id="loginBtn" 
                        class="btn btn-primary"
                        aria-label="Login to your account"
                    >
                        <span class="btn-text">Login</span>
                        <span id="loadingSpinner" class="spinner" style="display: none;" aria-hidden="true"></span>
                    </button>
                </form>

                <div class="additional-links">
                    <p>Don't have an account? <a href="#">Register here</a></p>
                </div>
            </div>
        </main>

        <footer role="contentinfo">
            <p>&copy; 2024 Indian Bank. All rights reserved.</p>
            <p class="security-notice">
                <span class="lock-icon">🔒</span>
                Your connection is secure
            </p>
        </footer>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
